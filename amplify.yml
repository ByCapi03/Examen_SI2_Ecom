# AWS Amplify Hosting (monorepo): compila solo la carpeta frontend.
# VITE_API_URL se define en Amplify → Environment variables (URL pública de App Runner).
version: 1
applications:
  - appRoot: frontend
    frontend:
      phases:
        preBuild:
          commands:
            - npm ci
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: dist
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
